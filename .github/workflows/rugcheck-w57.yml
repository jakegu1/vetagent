          name: ${{ steps.p192.outputs.result-name }}
          path: ${{ runner.temp }}/w57-192/result
          if-no-files-found: error
          retention-days: 7
      - if: ${{ always() && steps.p192.outputs.ready == 'true' }}
        env:
          W57_UPLOADED: ${{ steps.r192.outcome }}
          W57_RESULT_ID: ${{ steps.r192.outputs.artifact-id }}
          W57_RESULT_DIGEST: ${{ steps.r192.outputs.artifact-digest }}
        run: python bench/rugcheck_w57_session.py finish --out "$RUNNER_TEMP/w57-192"

  closure:
    needs: [segment_00, segment_01, segment_02, segment_03, segment_04, segment_05, segment_06, segment_07, segment_08, segment_09]
    if: ${{ always() && inputs.phase != 'report' && inputs.phase != 'legacy-report' && inputs.phase != 'report192' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Freeze the hosted job clock once
        run: |
          python3 -c 'import json,os,time; from pathlib import Path; Path(os.environ["RUNNER_TEMP"],"w57-job-clock.json").write_text(json.dumps({"utc":time.time(),"monotonic":time.monotonic(),"seconds":19800}),encoding="utf-8")'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check generated control source without rewriting it
        run: python .github/scripts/render_w57_session_workflow.py --check
      - id: close
        run: python bench/rugcheck_w57_session.py closure --out "$RUNNER_TEMP/w57-closure"
      - id: rescue
        if: ${{ always() && steps.close.outputs.rescue == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.close.outputs.result-name }}
          path: ${{ runner.temp }}/w57-closure/result
          if-no-files-found: error
          retention-days: 7
      - id: index
        if: ${{ always() && steps.close.outputs.index-ready == 'true' }}
        env:
          W57_UPLOADED: ${{ steps.rescue.outcome }}
          W57_RESULT_ID: ${{ steps.rescue.outputs.artifact-id }}
          W57_RESULT_DIGEST: ${{ steps.rescue.outputs.artifact-digest }}
        run: python bench/rugcheck_w57_session.py close-index --out "$RUNNER_TEMP/w57-closure"
      - id: admission
        if: ${{ always() && steps.index.outputs.ready == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ (inputs.phase == 'pilot192' || inputs.phase == 'start192') && 'w57-admission-result-v3' || 'w57-admission-result-v2' }}
          path: ${{ runner.temp }}/w57-closure/admission-result
          if-no-files-found: error
          retention-days: 7
      - id: evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ format('w57-{0}-closure-r{1}-v{2}', inputs.phase == 'canary' && 'canary' || ((inputs.phase == 'pilot192' || inputs.phase == 'start192') && 'live192' || 'live'), github.run_id, (inputs.phase == 'pilot192' || inputs.phase == 'start192') && '3' || '2') }}
          path: ${{ runner.temp }}/w57-closure
          if-no-files-found: error
          retention-days: 7
      - if: ${{ always() }}
        env:
          W57_UPLOADED: ${{ steps.evidence.outcome }}
        run: python bench/rugcheck_w57_session.py closure-finish --out "$RUNNER_TEMP/w57-closure"
