# Generated by .github/scripts/render_w57_session_workflow.py; do not hand-edit.
name: rugcheck-w57

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Explicit finite mode; canary never contacts a Vendor
        type: choice
        options: [canary, pilot, start, report, legacy-report, pilot192, start192, report192]
        default: canary
        required: true
      study:
        description: New ID for pilot/start; existing ID for report
        type: string
        required: false
      pilot:
        description: Successful earlier pilot result Artifact ID for start
        type: string
        required: false
      source-run:
        description: Existing v2 session run ID for read-only report
        type: string
        required: false
      report-namespace:
        description: Keep synthetic reports separate from live research
        type: choice
        options: [canary, live, live192]
        default: canary

permissions:
  contents: read
  actions: read

concurrency:
  group: rugcheck-w57-study
  cancel-in-progress: false

env:
  W57_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PYTHONIOENCODING: utf-8
  W57_PHASE: ${{ inputs.phase }}
  W57_STUDY: ${{ inputs.study }}
  W57_PILOT: ${{ inputs.pilot }}
  W57_SOURCE_RUN: ${{ inputs.source-run }}
  W57_REPORT_NAMESPACE: ${{ inputs.report-namespace }}

jobs:
  segment_00:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Freeze the hosted job clock once
        run: |
          python3 -c 'import json,os,time; from pathlib import Path; Path(os.environ["RUNNER_TEMP"],"w57-job-clock.json").write_text(json.dumps({"utc":time.time(),"monotonic":time.monotonic(),"seconds":19800}),encoding="utf-8")'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check generated control source without rewriting it
        run: python .github/scripts/render_w57_session_workflow.py --check
      - name: Prepare explicit mode
        id: prepare
        if: ${{ inputs.phase == 'pilot' || inputs.phase == 'start' || inputs.phase == 'report' || inputs.phase == 'legacy-report' || inputs.phase == 'pilot192' || inputs.phase == 'start192' || inputs.phase == 'report192' }}
        run: python bench/rugcheck_w57_session.py admit --out "$RUNNER_TEMP/w57-admission"
      - id: admission
        if: ${{ steps.prepare.outputs.action == 'collect' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ (inputs.phase == 'pilot192' || inputs.phase == 'start192') && 'w57-admission-intent-v3' || 'w57-admission-intent-v2' }}
          path: ${{ runner.temp }}/w57-admission/admission-intent
          if-no-files-found: error
          retention-days: 7
      - id: intent
        if: ${{ steps.prepare.outputs.action == 'collect' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.prepare.outputs.intent-name }}
          path: ${{ runner.temp }}/w57-admission/intent
          if-no-files-found: error
          retention-days: 7
      - id: collect
        if: ${{ steps.prepare.outputs.action == 'collect' && steps.intent.outcome == 'success' && steps.admission.outcome == 'success' }}
        continue-on-error: true
        env:
          W57_INTENT_ID: ${{ steps.intent.outputs.artifact-id }}
          W57_INTENT_DIGEST: ${{ steps.intent.outputs.artifact-digest }}
        run: python bench/rugcheck_w57_session.py collect --out "$RUNNER_TEMP/w57-admission"
      - if: ${{ always() && steps.prepare.outputs.ready == 'true' }}
        run: python bench/rugcheck_w57_session.py finalize --out "$RUNNER_TEMP/w57-admission"
      - name: Preserve completed and partial observations
