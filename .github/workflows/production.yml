name: production

# The maturity score has two items only production can answer -- are the abuse guards
# working on the live service, and how often does it answer `unknown` to real calls -- and
# it may read only what is committed, because a test regenerates it and diffs the result.
# On 2026-09-14 every test was green while production served 313 calls past a rate limiter
# that never limited, and the benchmark (cached upstreams) reported 18.2% unknown while a
# live hour had measured 33.8%. This job observes both once a day and commits what it saw.
#
# It commits under the "Production probe" prefix, which tools/rounds.py and tools/owner.py
# treat like the snapshot bot: data collection, not development.

on:
  schedule:
    - cron: "40 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-probe
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: tools/owner.py and tools/rounds.py read git log, and the pages they
      # write have to match what test.yml regenerates with fetch-depth 0.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe the abuse guards
        run: python bench/production_probe.py --write

      - name: Count production verdicts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::no Cloudflare credentials: the production unknown rate stays not measured"
          else
            python bench/usage.py --write-verdicts bench/production/verdicts.json \
              || echo "::warning::verdict query failed: nothing written, nothing claimed"
          fi

      # DECISIONS E30. test.yml already fails the build on a contract change; what it
      # cannot see is an upstream that stops answering for a week, because the contract
      # test then asserts nothing and prints "all passed". This records what the run
      # managed to observe. `|| true`: a contract failure is test.yml's to report, and
      # losing the record would remove the only evidence of how long this has been going
      # on -- which is the single thing the record is for.
      - name: Record what the upstream contract monitor could observe
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tests/test_upstream_contract.py \
            --status-json bench/production/upstream_contract.json || true

      # The observations alone. The pages that quote them are regenerated after this, in a
      # commit of their own (the step below), so a conflict on a page a human also
      # regenerates can never cost the day's record.
      - name: Commit
        run: |
          git config user.name "vetagent-production[bot]"
          git config user.email "noreply@vetagent.dev"
          # Never anything under src/: a push touching it would trigger a deploy.
          git add bench/production/
          if git diff --staged --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Production probe $(date -u +%F): guards and verdicts"
          for attempt in 1 2 3 4 5; do
            if git push; then echo "pushed on attempt ${attempt}"; exit 0; fi
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $(( attempt * 10 ))
          done
          echo "::error::could not push the production probe after 5 attempts"
          exit 1

      # This used to be an inline list -- scorecard, owner, rounds -- under a comment saying
      # "or test.yml goes red on this bot's push". The list was one generator short: it had
      # no publish_numbers, so c66c6be left docs/EXPERIMENT_C.md quoting a stale live rate,
      # the third time that happened. And the comment's premise was false: a GITHUB_TOKEN
      # push starts no workflow, so test.yml never ran on this bot's push to go red on it.
      # Both halves are fixed at the seam: one shared list, derived and checked by
      # tests/test_bot_commits_stay_green.py, and test.yml runs after this workflow.
      - name: Regenerate the pages that quote it
        env:
          PYTHONIOENCODING: utf-8
        run: bash .github/scripts/regenerate-derived.sh "Production probe $(date -u +%F)"
