name: production

# The maturity score has two items only production can answer -- are the abuse guards
# working on the live service, and how often does it answer `unknown` to real calls -- and
# it may read only what is committed, because a test regenerates it and diffs the result.
# On 2026-09-14 every test was green while production served 313 calls past a rate limiter
# that never limited, and the benchmark (cached upstreams) reported 18.2% unknown while a
# live hour had measured 33.8%. This job observes both once a day and commits what it saw.
#
# It commits under the "Production probe" prefix, which tools/rounds.py and tools/owner.py
# treat like the snapshot bot: data collection, not development.

on:
  schedule:
    - cron: "40 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-probe
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: tools/owner.py and tools/rounds.py read git log, and the pages they
      # write have to match what test.yml regenerates with fetch-depth 0.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe the abuse guards
        run: python bench/production_probe.py --write

      - name: Count production verdicts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::no Cloudflare credentials: the production unknown rate stays not measured"
          else
            python bench/usage.py --write-verdicts bench/production/verdicts.json \
              || echo "::warning::verdict query failed: nothing written, nothing claimed"
          fi

      # Regenerate everything that quotes the score, in the same commit, or test.yml goes
      # red on this bot's push.
      - name: Regenerate the pages that read it
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python bench/scorecard.py --write
          python tools/owner.py --write
          python tools/rounds.py --write

      - name: Commit
        run: |
          git config user.name "vetagent-production[bot]"
          git config user.email "noreply@vetagent.dev"
          # Never anything under src/: a push touching it would trigger a deploy.
          git add bench/production/ docs/SCORECARD.md docs/OWNER.md docs/ROUNDS.md
          if git diff --staged --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Production probe $(date -u +%F): guards and verdicts"
          for attempt in 1 2 3 4 5; do
            if git push; then echo "pushed on attempt ${attempt}"; exit 0; fi
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $(( attempt * 10 ))
          done
          echo "::error::could not push the production probe after 5 attempts"
          exit 1
