name: snapshot

# Daily new-pool snapshot. DECISIONS P4.
#
# Why this must run automatically: the whole value of this data is **continuity**.
# Upstream serves only current state, no historical queries — a day we miss never existed,
# and no budget buys it back. Relying on a human to remember builds the gap into the design.
#
# We capture raw observables — price, reserves, trade count, buyer/seller address counts —
# not today's scores. Scoring rules change; the raw numbers don't, and recomputing history
# under new rules only works if the raw numbers are there.

on:
  schedule:
    - cron: "23 2 * * *"   # 02:23 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect
        run: python bench/snapshot.py --chains eth,base,bsc,solana

      - name: Commit
        run: |
          git config user.name "vetagent-snapshot[bot]"
          git config user.email "noreply@vetagent.dev"
          git add bench/snapshots/
          if git diff --staged --quiet; then
            # Zero rows means every upstream is down. That deserves a warning, not silence.
            echo "::warning::no snapshot rows collected — every upstream may be down"
            exit 0
          fi
          days=$(ls bench/snapshots/pools-*.ndjson 2>/dev/null | wc -l)
          rows=$(cat bench/snapshots/pools-*.ndjson | wc -l)
          git commit -m "Snapshot $(date -u +%F): ${days} days, ${rows} rows total"
          git push
