name: snapshot

# Daily new-pool snapshot. DECISIONS P4.
#
# Why this must run automatically: the whole value of this data is **continuity**.
# Upstream serves only current state, no historical queries — a day we miss never existed,
# and no budget buys it back. Relying on a human to remember builds the gap into the design.
#
# We capture raw observables — price, reserves, trade count, buyer/seller address counts —
# not today's scores. Scoring rules change; the raw numbers don't, and recomputing history
# under new rules only works if the raw numbers are there.

on:
  schedule:
    # Four passes a day, not one. Depth cannot be accelerated -- a day not recorded never
    # existed -- but width can, and the dead cohort the benchmark needs grows with pools
    # recorded x days elapsed. A pool that launches and dies between two daily passes is
    # never seen at all, and those are exactly the samples worth having.
    - cron: "23 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # Full history: the last step regenerates docs/ROUNDS.md and docs/OWNER.md, which are
      # read out of git log, and a depth-1 checkout would write a log of one commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The pool rows are the irreplaceable product: "a day we miss never existed".
      # Collect and COMMIT them before anything optional runs.
      - name: Collect pools
        id: collect_pools
        continue-on-error: true
        run: python bench/snapshot.py --pages 5 --sellability 0 --request-gap 12.1

      - name: Commit pools
        if: ${{ always() && steps.collect_pools.outcome != 'skipped' }}
        run: bash .github/scripts/snapshot-commit.sh "pools"

      # Only now the add-on. For 25 of the newest tokens, ask honeypot.is whether they
      # can be sold RIGHT NOW -- the only observable here that cannot be recovered later,
      # because a sell simulation needs a live pool and a dead token has none.
      #
      # It runs SECOND, in its own step, with continue-on-error, for a reason that was
      # measured rather than guessed: its worst case is roughly 25 x (25 s timeout x 3
      # retries), which exceeds this job's 25-minute limit. In the original ordering that
      # sat between the pool file being written and the commit, so a honeypot.is outage
      # would take the runner down with that pass's pool rows still only on the runner's
      # disk. The optional thing could permanently destroy the primary thing, and
      # precisely when the upstream was already degraded.
      - name: Collect day-one sellability
        if: ${{ success() && steps.collect_pools.outcome == 'success' }}
        continue-on-error: true
        run: python bench/snapshot.py --sellability-only 25

      - name: Commit sellability
        if: ${{ success() && steps.collect_pools.outcome == 'success' }}
        continue-on-error: true
        run: bash .github/scripts/snapshot-commit.sh "sellability"

      # Last, and in a commit of its own, because the rows above must never share a commit
      # that can conflict. `bench/scorecard.py` counts snapshot days, so the first pass after
      # midnight UTC moves docs/SCORECARD.md -- and until 2026-09-22 nothing regenerated it:
      # 503b7a6 left master red for four hours, and no run noticed, because this push starts
      # no test.yml. A failure here is reported loudly and costs no rows: they are already
      # on origin.
      - name: Regenerate the pages that quote the archive
        if: ${{ success() && steps.collect_pools.outcome != 'skipped' }}
        env:
          PYTHONIOENCODING: utf-8
        run: bash .github/scripts/regenerate-derived.sh "Snapshot $(date -u +%F)"

      # Preservation precedes this failure signal. An older healthy pass cannot hide
      # a collector that failed before writing a manifest during this job.
      - name: Check pool coverage
        if: ${{ always() }}
        env:
          POOL_COLLECTION_OUTCOME: ${{ steps.collect_pools.outcome }}
        run: |
          python bench/snapshot.py --check-coverage
          if [ "$POOL_COLLECTION_OUTCOME" != "success" ]; then
            echo "::error::Pool collection failed during this pass."
            exit 1
          fi
