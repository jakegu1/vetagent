name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # benchmark once a week, Monday 03:17 UTC

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: |
          python -m compileall -q src tests

      - name: Regression tests (offline, real upstream snapshots)
        run: python tests/test_risk.py

      - name: MCP protocol tests
        run: python tests/test_mcp.py

      # The repo has one language. Without a check, Chinese creeps back one comment at
      # a time and a would-be contributor bounces off a file they cannot read.
      - name: English-only check
        run: python tests/test_english_only.py

      # Parked ideas must be decided on schedule. Deferring without a forced review is
      # a nicer word for dropping something.
      - name: Parked opportunities are not overdue
        run: python tests/test_gates_get_reviewed.py

      # What the site, the README and /llms.txt claim about accuracy must equal what the
      # benchmark measured. They had drifted three generations apart, in a product whose
      # pitch is that its numbers can be checked.
      - name: Published accuracy figures match the benchmark
        run: python tests/test_published_numbers.py

      # The score moves with every commit, so it belongs in the run that produces the
      # commit. It is also the check most likely to catch a stale claim elsewhere.
      - name: Maturity scorecard
        run: python bench/scorecard.py

      # The development log is generated from git, and this fails if any commit belongs
      # to no round -- so the log cannot be incomplete, rather than relying on someone
      # remembering to append to it.
      - name: Development rounds are complete and current
        run: python tests/test_rounds.py

      # The backlog is the last hand-maintained document, so it gets the strictest shape
      # check: an open item that cannot name how it will be verified is a wish.
      - name: Backlog items can be verified
        run: python tests/test_backlog.py

      # The pinned function selectors are recomputed here. A wrong one never matches, so
      # the contract looks powerless and the tool reports that as reassurance.
      - name: Owner-power selectors are real, and disclosure never scores
        run: python tests/test_owner_powers.py

  # Upstream contract monitor: real API calls that check the fields we depend on still exist.
  # Separate from the unit tests: a third-party outage turns it red, which is the signal.
  upstream-contract:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify upstream API contracts
        run: python tests/test_upstream_contract.py

      # Also network-dependent: it round-trips decoded pool addresses against the chain,
      # which is the only assertion that can catch a wrong byte offset. It was written
      # and then never wired in here, so it protected nothing outside a local run.
      - name: Backfill decoder round-trip
        run: python tests/test_backfill.py

  # Accuracy benchmark. Not on every push: heavy real upstream traffic, tens of minutes.
  # Pipeline smoke test -- NOT the published measurement.
  #
  # A runner has no bench/cache and no bench/backfill (both gitignored), so this
  # rebuilds a small dataset from scratch and produces a different, smaller number
  # than bench/results.md. It exists to prove the pipeline still runs end to end and
  # that the independence assertions still hold, not to reproduce the report.
  #
  # The comment here used to say results were committed so the diff was the signal.
  # Nothing was ever committed and nobody read the artifact, so the claim was doing
  # the work the job was not.
  benchmark:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild a small labelled dataset from scratch
        run: python bench/build_dataset.py --limit 150
      - name: Run benchmark
        # The independence assertions exit non-zero on failure, and must not be ignored:
        # a benchmark that argues in a circle does more harm than no benchmark at all.
        run: python bench/run_benchmark.py
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-smoke-test-results
          path: |
            bench/results.md
            bench/results.json
            bench/dataset.json
