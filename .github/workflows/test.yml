name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # benchmark once a week, Monday 03:17 UTC

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: |
          python -m compileall -q src tests

      - name: Regression tests (offline, real upstream snapshots)
        run: python tests/test_risk.py

      - name: MCP protocol tests
        run: python tests/test_mcp.py

      # The repo has one language. Without a check, Chinese creeps back one comment at
      # a time and a would-be contributor bounces off a file they cannot read.
      - name: English-only check
        run: python tests/test_english_only.py

      # Parked ideas must be decided on schedule. Deferring without a forced review is
      # a nicer word for dropping something.
      - name: Parked opportunities are not overdue
        run: python tests/test_gates_get_reviewed.py

  # Upstream contract monitor: real API calls that check the fields we depend on still exist.
  # Separate from the unit tests: a third-party outage turns it red, which is the signal.
  upstream-contract:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify upstream API contracts
        run: python tests/test_upstream_contract.py

  # Accuracy benchmark. Not on every push: heavy real upstream traffic, tens of minutes.
  # Manual trigger or weekly; results are committed to the repo, so the diff is the signal.
  benchmark:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild labelled dataset
        run: python bench/build_dataset.py --limit 150
      - name: Run benchmark
        # The independence assertions exit non-zero on failure, and must not be ignored:
        # a benchmark that argues in a circle does more harm than no benchmark at all.
        run: python bench/run_benchmark.py
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            bench/results.md
            bench/results.json
            bench/dataset.json
