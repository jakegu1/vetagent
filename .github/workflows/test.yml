name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # benchmark once a week, Monday 03:17 UTC

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0, because tools/rounds.py reads the whole history and
      # score_at() does `git show <commit>:docs/SCORECARD.md`. The default depth
      # of 1 made test_rounds.py fail on every push from R11 onwards, and because
      # it fails early the three steps after it -- the backlog check, the
      # owner-power suite and the scorecard -- had never run in CI at all.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: |
          python -m compileall -q src tests

      - name: Regression tests (offline, real upstream snapshots)
        run: python tests/test_risk.py

      - name: MCP protocol tests
        run: python tests/test_mcp.py

      # The repo has one language. Without a check, Chinese creeps back one comment at
      # a time and a would-be contributor bounces off a file they cannot read.
      - name: English-only check
        run: python tests/test_english_only.py

      # Parked ideas must be decided on schedule. Deferring without a forced review is
      # a nicer word for dropping something.
      - name: Parked opportunities are not overdue
        run: python tests/test_gates_get_reviewed.py

      # What the site, the README and /llms.txt claim about accuracy must equal what the
      # benchmark measured. They had drifted three generations apart, in a product whose
      # pitch is that its numbers can be checked.
      - name: Published accuracy figures match the benchmark
        run: python tests/test_published_numbers.py

      # The score moves with every commit, so it belongs in the run that produces the
      # commit. It is also the check most likely to catch a stale claim elsewhere.
      - name: Maturity scorecard
        run: python bench/scorecard.py

      # The development log is generated from git, and this fails if any commit belongs
      # to no round -- so the log cannot be incomplete, rather than relying on someone
      # remembering to append to it.
      - name: Development rounds are complete and current
        run: python tests/test_rounds.py

      # The backlog is the last hand-maintained document, so it gets the strictest shape
      # check: an open item that cannot name how it will be verified is a wish.
      - name: Backlog items can be verified
        run: python tests/test_backlog.py

      # The pinned function selectors are recomputed here. A wrong one never matches, so
      # the contract looks powerless and the tool reports that as reassurance.
      - name: Owner-power selectors are real, and disclosure never scores
        run: python tests/test_owner_powers.py

      # DECISIONS.md calls a named test "the strongest kind" of enforcement. Three of the
      # names it gave pointed at tests that do not exist, and one of those was drift
      # introduced by a rename in this very round. This step also fails if a test file
      # exists that no step above runs -- a guard CI never invokes is not a guard.
      - name: Decisions name real tests, and every test runs here
        run: python tests/test_decisions_enforcement.py

      # The 2026-09-18 gate decides whether feature work continues, and its first two
      # counting rules were both wrong: one counted crawlers as users, the next was
      # written and never called. This pins that the rule which prints the verdict is
      # the rule that ran, and that it counts tool use rather than connections.
      - name: The usage gate counts the right thing
        run: python tests/test_usage_gate.py

      # /assess and /liquidity were invisible to the telemetry, so the gate that
      # decides whether feature work continues was reading one of two interfaces.
      # This also pins that adding telemetry did not start recording token addresses.
      - name: HTTP calls are recorded, and addresses are not
        run: python tests/test_http_telemetry.py

      # docs/OWNER.md is the only page here written for someone who will not read the
      # code, and it carries the deadlines. A stale deadline on the page whose job is
      # deadlines is worse than no page.
      - name: The owner's page is current and its numbers are the measured ones
        run: python tests/test_owner_page.py

      # A daily collector that silently records nothing is the worst kind of bug here:
      # invisible, and the loss is permanent. The first run of this probe sent a
      # chain-prefixed id as an address and got six nulls back.
      - name: The day-one sellability archive collects something real
        run: python tests/test_sellability_archive.py

      # W13. The Cloudflare account and zone ids were in docs/HANDOFF.md in plain text for
      # six days. Neither is a secret and neither can be rotated, so this does not protect
      # a credential -- it protects against the phishing message that quotes your account
      # id to sound like it already has access. Both values are still in public commit
      # 5a16721 and always will be; what this stops is the next time somebody pastes them
      # back in while writing a deploy note, which is exactly how they arrived.
      - name: Private identifiers have not come back into the public repo
        run: python tests/test_no_private_identifiers.py

      # The claim "nobody in this category publishes their error rates" is false and was
      # retracted on 2026-09-06. It then survived six more times in six different
      # phrasings, and three successive guards each missed it because each was written
      # against the wording of the survivor in front of it. This pins the corpus.
      - name: No phrasing of the retracted claim has come back
        run: python tests/test_retracted_claim.py

      # DECISIONS B15. The archive is public in git until the packed repository passes
      # 200 MB, then days older than 90 move to R2. A plan to act "when the repo gets
      # big" is a wish; this is the date. It warns at 80% so the move can be scheduled
      # rather than arriving as a red build.
      - name: The public archive is inside its size budget
        run: python tests/test_archive_budget.py

      # W21. The number guard checked that guarded figures still MATCH; it never checked
      # that it covered anything. Five outward surfaces created in R19 were never scanned,
      # and every figure inside a markdown blockquote was invisible to it because ">" is
      # both a blockquote marker and a comparison. Found by mutating all 87 percentages on
      # the live surfaces one at a time.
      - name: Every published number is covered by something
        run: python tests/test_number_coverage.py

      # The launch post's central claim is that the METHOD is reproducible. The frozen
      # dataset stored 18 oracle fields where the labeller reads 15, and four of those --
      # three of them adversarial traits -- were not among them, so a stranger could not
      # re-derive a single label. "Frozen" was true; "checkable" was not.
      - name: The frozen dataset can re-derive its own labels
        run: python tests/test_dataset_replayable.py

  # Upstream contract monitor: real API calls that check the fields we depend on still exist.
  # Separate from the unit tests: a third-party outage turns it red, which is the signal.
  upstream-contract:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify upstream API contracts
        run: python tests/test_upstream_contract.py

      # Also network-dependent: it round-trips decoded pool addresses against the chain,
      # which is the only assertion that can catch a wrong byte offset. It was written
      # and then never wired in here, so it protected nothing outside a local run.
      - name: Backfill decoder round-trip
        run: python tests/test_backfill.py

  # Accuracy benchmark. Not on every push: heavy real upstream traffic, tens of minutes.
  # Pipeline smoke test -- NOT the published measurement.
  #
  # A runner has no bench/cache and no bench/backfill (both gitignored), so this
  # rebuilds a small dataset from scratch and produces a different, smaller number
  # than bench/results.md. It exists to prove the pipeline still runs end to end and
  # that the independence assertions still hold, not to reproduce the report.
  #
  # The comment here used to say results were committed so the diff was the signal.
  # Nothing was ever committed and nobody read the artifact, so the claim was doing
  # the work the job was not.
  benchmark:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild a small labelled dataset from scratch
        run: python bench/build_dataset.py --limit 150
      - name: Run benchmark
        # The independence assertions exit non-zero on failure, and must not be ignored:
        # a benchmark that argues in a circle does more harm than no benchmark at all.
        run: python bench/run_benchmark.py
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-smoke-test-results
          path: |
            bench/results.md
            bench/results.json
            bench/dataset.json
