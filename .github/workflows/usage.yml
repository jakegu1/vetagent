name: Usage — who is actually calling

# The 2026-09-18 gate asks whether anyone outside this project uses the tool, and the
# answer decides whether feature work continues. Until now reading it meant remembering
# to export two secrets and run a script by hand, which is a poor way to hold up the one
# decision that can stop the project.
#
# It runs on a schedule so the answer exists whether or not anyone remembers to ask, and
# on demand so the gate can be settled with a button.

on:
  workflow_dispatch:
    inputs:
      days:
        description: >-
          Window in days. 14 is the gate's window. A shorter one exists because
          client attribution changed on 2026-09-07 (a03f430, b078d65): before it,
          our own CI was recorded as `curl` and our own landing page as `mozilla`,
          so a 14-day window still contains rows whose caller cannot be identified
          either way. Narrowing the window is how you ask what the fixed instrument
          sees, without touching the gate's own rule.
        required: false
        default: "14"
  schedule:
    # 08:00 UTC every Monday, plus the two days either side of the gate.
    - cron: "0 8 * * 1"

jobs:
  usage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Says plainly which of the two is missing. "Missing credentials" and "nobody
      # called" both look like zero and mean opposite things, and confusing them makes
      # the gate answer a question nobody asked.
      - name: Check the credentials exist
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set."
            echo "::warning::The token needs Account Analytics: Read. Until both exist,"
            echo "::warning::'0 external callers' is a fact about this repository's"
            echo "::warning::secrets and not about the product."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the gate's signal
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PYTHONIOENCODING: utf-8
          DAYS: ${{ github.event.inputs.days || '14' }}
        run: |
          python bench/usage.py --days "$DAYS" | tee usage.txt
          {
            echo "## External callers, last $DAYS days"
            echo ""
            echo '```'
            cat usage.txt
            echo '```'
            echo ""
            echo "The bar is printed inside the run above, quoted from RULE_TEXT in"
            echo "bench/usage.py -- it is not restated here. This summary used to"
            echo "describe the SECOND of four counting rules, which was superseded on"
            echo "2026-09-07, so on the day of the gate it would have told the reader"
            echo "the gate passes on evidence the code refuses."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the answer
        if: steps.creds.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usage-report
          path: usage.txt
          retention-days: 90
