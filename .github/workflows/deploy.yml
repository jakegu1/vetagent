name: deploy

# Deploying should not depend on any one laptop.
#
# Why: on 2026-09-04, shipping the first deploy fix, pywrangler would not run at all on
# local Windows (it builds an emscripten pyodide venv, which Windows does not support);
# it only went out via a detour through WSL. A deploy that runs on exactly one machine
# and one OS ties the ability to ship to one person.
#
# This workflow moves the deploy onto a Linux runner: merging to master ships it, anyone
# can trigger it, and when something breaks you read the log instead of guessing what
# someone's local environment looks like.

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "package-lock.json"
      - "pylock.toml"
      - "wrangler.jsonc"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # When credentials are not configured yet, skip instead of failing.
      # Going red on every push trains people to ignore red, and not being ignorable is
      # the whole value of a red build. So this separates "not configured yet" (skip,
      # normal) from "configured but the deploy failed" (red, broken).
      - name: Check credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN not set — skipping deploy. Add it in Settings → Secrets to enable automatic releases."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # The whole history, as test.yml checks out: the offline suite below reads it, and at
      # the default depth of 1 its rounds check fails on every run.
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Tests first. Shipping a risk-screening tool without them puts silent failure
      # right back in.
      #
      # All of them: every step of test.yml's offline `test` job, read from test.yml when this
      # runs, so the deploy and CI keep one list. Until 2026-09-29 this step ran two test files
      # by hand, and the tests workflow starts beside this one rather than before it, so a push
      # that broke any other step deployed anyway. The runner runs every step even after a red
      # one, and exits non-zero if any failed, if it found no steps, or if a step modified a
      # tracked file. Its condition is the deploy step's, so the deploy cannot run while it is
      # skipped. The network jobs stay out: a third party's outage must not block a deploy.
      - name: Offline test suite (every step of test.yml's test job)
        if: steps.creds.outputs.ready == 'true'
        run: python .github/scripts/offline_suite.py

      - name: Record committed lock byte hashes
        if: steps.creds.outputs.ready == 'true'
        run: sha256sum uv.lock pylock.toml package-lock.json > "$RUNNER_TEMP/build-locks.sha256"

      - name: Install uv
        if: steps.creds.outputs.ready == 'true'
        run: python -m pip install --no-deps uv==0.13.1

      - name: Install locked Node tooling
        if: steps.creds.outputs.ready == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify local Wrangler
        if: steps.creds.outputs.ready == 'true'
        run: node -e "const {execFileSync}=require('node:child_process'); const version=execFileSync(process.execPath,['./node_modules/wrangler/bin/wrangler.js','--version'],{encoding:'utf8'}).trim(); console.log(version); if(version!=='4.151.1') process.exit(1)"

      - name: Sync dependencies
        if: steps.creds.outputs.ready == 'true'
        run: uv sync --locked

      - name: Sync inspected target packages
        if: steps.creds.outputs.ready == 'true'
        run: uv run --locked pywrangler sync

      - name: Verify lock bytes before upload
        if: steps.creds.outputs.ready == 'true'
        run: sha256sum --check "$RUNNER_TEMP/build-locks.sha256"

      - name: Check tracked files before upload
        if: steps.creds.outputs.ready == 'true'
        run: git diff --exit-code

      # Must be pywrangler, not bare wrangler: bare wrangler does not vendor workers-py,
      # so the deployed Worker fails on startup with ModuleNotFoundError: No module named
      # 'workers'.
      - name: Deploy to Cloudflare
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run --locked pywrangler deploy

      # A green deploy is not the same as a working fix. Hit the critical paths with real
      # production calls and let a failure turn this deploy red — this is exactly the step
      # that was missing when the honeypot check failed silently.
      - name: Smoke test production
        if: steps.creds.outputs.ready == 'true'
        run: |
          set -e
          # Name ourselves on every call. GitHub's runners are in the US and these curls
          # carry no client name, so five production calls per deploy were landing in the
          # usage gate's `curl` bucket as external traffic from a foreign country -- the
          # same defect as `vetagent-r16-verify`, and it put a YES on the 09-18 gate.
          CI_TAG="-H x-mcp-client:vetagent-ci-smoke"
          echo "--- /health ---"
          curl -sS $CI_TAG --max-time 30 https://vetagent.dev/health | tee /tmp/health.json
          grep -q '"status": "ok"' /tmp/health.json

          echo ""
          echo "--- JSON-RPC errors must be top-level ---"
          curl -sS $CI_TAG --max-time 30 -X POST https://vetagent.dev/mcp \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"resources/list"}' | tee /tmp/err.json
          python -c "import json;d=json.load(open('/tmp/err.json'));assert 'error' in d and 'result' not in d, d"

          echo ""
          echo "--- GET /mcp must be 405, not 200 ---"
          test "$(curl -sS $CI_TAG -o /dev/null -w '%{http_code}' --max-time 30 https://vetagent.dev/mcp)" = "405"

          echo ""
          echo "--- CORS preflight must not 400 ---"
          test "$(curl -sS $CI_TAG -o /dev/null -w '%{http_code}' --max-time 30 -X OPTIONS \
            https://vetagent.dev/mcp -H 'Origin: https://example.com')" = "204"

          echo ""
          echo "--- a failed sell simulation must NOT come back as a pass ---"
          curl -sS $CI_TAG --max-time 90 -X POST https://vetagent.dev/mcp \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"assess_token_risk","arguments":{"address":"0x50614cc8e44f7814549c223aa31db9296e58057c","chain_hint":"ethereum"}}}' \
            > /tmp/hp.json
          python - <<'PYCHECK'
          import json
          d = json.load(open('/tmp/hp.json'))
          r = json.loads(d['result']['content'][0]['text'])
          sigs = {s['category']: s['severity'] for s in r['signals']}
          assert r['risk_level'] != 'low', f"a token that cannot be bought was rated low: {r}"
          assert sigs.get('honeypot') != 'ok', f"failed simulation reported as a pass: {sigs}"
          print("sellability guard OK:", r['risk_level'], sigs)
          PYCHECK

          echo ""
          echo "--- blue-chip canary: the tokens agents ask about most must get an answer ---"
          # Measured 2026-09-12: 33.8% of live answers over an hour were `unknown`, 57.1% on
          # Ethereum majors, every one "upstream request failed". The benchmark reads a
          # cache and cannot see it, so nothing in this repository did. This prints what
          # production says about three assets nobody could call risky.
          #
          # It fails the deploy only on what the engine owns: a blue chip rated high, or
          # an unknown blamed on the token. An unknown blamed on an upstream is annotated,
          # not failed -- turning a third party's rate limit into a red deploy trains
          # people to ignore red, which is the one thing this workflow must not do.
          for spec in "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2 ethereum WETH" \
                      "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913 base USDC" \
                      "0x55d398326f99059fF775485246999027B3197955 bsc USDT"; do
            set -- $spec
            curl -sS $CI_TAG --max-time 90 -X POST https://vetagent.dev/mcp \
              -H 'Content-Type: application/json' \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\",\"params\":{\"name\":\"assess_token_risk\",\"arguments\":{\"address\":\"$1\",\"chain_hint\":\"$2\"}}}" \
              > /tmp/canary.json
            CANARY_NAME="$3" python - <<'PYCANARY'
          import json, os
          name = os.environ["CANARY_NAME"]
          d = json.load(open("/tmp/canary.json"))
          r = json.loads(d["result"]["content"][0]["text"])
          level = r["risk_level"]
          gaps = (r.get("evidence") or {}).get("data_gaps") or []
          reasons = "; ".join("%s: %s" % (g.get("dimension"), g.get("reason")) for g in gaps)
          print("%s -> %s %s" % (name, level, reasons))
          assert level != "high", "%s rated high: %s" % (name, r["signals"])
          if level == "unknown":
              ours = all(str(g.get("reason", "")).startswith("upstream request failed")
                         for g in gaps if g.get("dimension") in ("liquidity", "sellability"))
              assert ours, "%s unknown for a reason that is not an upstream outage: %s" % (name, reasons)
              print("::warning::blue-chip canary: %s came back unknown on an upstream failure (%s)" % (name, reasons))
          PYCANARY
          done

          echo ""
          echo "--- a flooding caller must get 429 (the limiter fails open when unbound) ---"
          # Invalid input and the existing self tag exercise counting without provider calls.
          # The minute-boundary argument requires one location; reuse encourages, but does not
          # guarantee, that locality. Only an observed Worker429/limited qualifies this attempt.
          if timeout 55s bash --noprofile --norc -s -- $CI_TAG <<'RATECANARY'
          set -euo pipefail
          endpoint=https://vetagent.dev/mcp
          args=(--http1.1 --rate 4/s --silent --show-error --fail-early --max-time 30
                --request POST "$@" --header 'Content-Type: application/json'
                --data '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"assess_token_risk","arguments":{"address":"not-an-address"}}}'
                --write-out '%{http_code}|%header{x-vetagent-ratelimit}|%header{cf-ray}|%{num_connects}\n')
          for i in $(seq 1 125); do
            # curl associates one output destination with each URL, not just the first.
            args+=(--output /dev/null "$endpoint")
          done
          set +e
          curl "${args[@]}" 2>/dev/null | {
            declare -A status_counts=() state_counts=() location_counts=()
            seen=0
            limited=0
            invalid=0
            connections=0
            while IFS='|' read -r code state ray fresh extra; do
              seen=$((seen + 1))
              fresh=${fresh%$'\r'}
              if [[ ! $code =~ ^[0-9]{3}$ ]]; then code=invalid; invalid=1; fi
              case "$state" in
                ok|limited) state_kind=$state ;;
                open:*) state_kind=open ;;
                '') state_kind=missing ;;
                *) state_kind=invalid ;;
              esac
              status_counts[$code]=$((${status_counts[$code]:-0} + 1))
              state_counts[$state_kind]=$((${state_counts[$state_kind]:-0} + 1))
              if [[ ${#ray} -le 64 && $ray =~ ^[[:xdigit:]]{16,32}-([A-Z]{3})$ ]]; then
                location=${BASH_REMATCH[1]}
              else
                location=missing
                invalid=1
              fi
              location_counts[$location]=$((${location_counts[$location]:-0} + 1))
              case "$fresh" in 0|1) connections=$((connections + fresh)) ;; *) invalid=1 ;; esac
              case "$code:$state" in
                200:ok) ;;
                429:limited) limited=$((limited + 1)) ;;
                *) invalid=1 ;;
              esac
              if [[ -n $extra || $seen -gt 125 || $connections -gt 125 ]]; then invalid=1; fi
            done
            printf 'rate-canary requests=%d connections=%d limited=%d invalid=%d' "$seen" "$connections" "$limited" "$invalid"
            for key in "${!status_counts[@]}"; do printf ' status_%s=%d' "$key" "${status_counts[$key]}"; done
            for key in "${!state_counts[@]}"; do printf ' state_%s=%d' "$key" "${state_counts[$key]}"; done
            for key in "${!location_counts[@]}"; do printf ' location_%s=%d' "$key" "${location_counts[$key]}"; done
            printf '\n'
            [[ $seen -eq 125 && $limited -gt 0 && $invalid -eq 0 ]]
          }
          pipeline_codes=("${PIPESTATUS[@]}")
          set -e
          if (( pipeline_codes[0] != 0 || pipeline_codes[1] != 0 )); then
            echo 'rate-canary failed: transport, incomplete results or no qualified enforcement'
            exit 1
          fi
          RATECANARY
          then
            :
          else
            echo 'rate-canary failed: incomplete or unqualified attempt'
            exit 1
          fi

      # Tell search engines the pages exist. GEO baseline 2026-09-15: site:vetagent.dev
      # returned nothing, and nothing had ever told an engine about the site. IndexNow is
      # shared by Bing, Yandex, Seznam and others, and ChatGPT's search reads Bing's index.
      # The URL list is read from the live sitemap, so the two cannot disagree. The key is
      # public by protocol and served at /<key>.txt (src/entry.py INDEXNOW_KEY).
      # A refusal is annotated, not failed: an engine's queue is not a reason to red a deploy.
      - name: Ping IndexNow
        if: steps.creds.outputs.ready == 'true'
        run: |
          CI_TAG="-H x-mcp-client:vetagent-ci-smoke"
          KEY="bff341c9bde3fe572840f1d103debec5"
          test "$(curl -sS $CI_TAG --max-time 30 https://vetagent.dev/${KEY}.txt)" = "$KEY"
          urls=$(curl -sS $CI_TAG --max-time 30 https://vetagent.dev/sitemap.xml \
                 | grep -o '<loc>[^<]*' | sed 's/<loc>//' | python3 -c "import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          body=$(python3 -c "import json,sys; print(json.dumps({'host': 'vetagent.dev', 'key': sys.argv[1], 'keyLocation': 'https://vetagent.dev/%s.txt' % sys.argv[1], 'urlList': json.loads(sys.argv[2])}))" "$KEY" "$urls")
          code=$(curl -sS -o /tmp/indexnow.txt -w '%{http_code}' --max-time 30 -X POST https://api.indexnow.org/indexnow \
                 -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow answered HTTP $code for $(echo "$urls" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))') URLs"
          case "$code" in
            200|202) ;;
            *) echo "::warning::IndexNow answered HTTP $code: $(head -c 200 /tmp/indexnow.txt)" ;;
          esac
