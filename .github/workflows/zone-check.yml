name: zone-check

# Read-only: is Cloudflare stopping AI crawlers from reading vetagent.dev?
#
# GEO -- being cited by the models agent developers ask -- depends on GPTBot, ClaudeBot,
# PerplexityBot and OAI-SearchBot actually fetching the site and /llms.txt. Spoofing their
# user agents from a laptop returns 200 (measured 2026-09-15), which proves nothing: the
# zone's "block AI bots" setting acts on verified crawler IPs, not on user-agent strings. So
# the setting itself is read, with the repository's own API token, which never leaves CI.
#
# Prints setting values only. It changes nothing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the zone's bot and crawler settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -u
          api() {
            curl -sS -m 30 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4$1"
          }
          zone=$(api "/zones?name=vetagent.dev" | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('result') or []; print(r[0]['id'] if r else ''); sys.stderr.write('zones lookup success=%s errors=%s\n' % (d.get('success'), d.get('errors')))")
          if [ -z "$zone" ]; then
            echo "::warning::zone not readable with this token (it may lack Zone:Read)"
            exit 0
          fi
          for path in bot_management settings/security_level settings/browser_check; do
            echo "=== $path"
            api "/zones/${zone}/${path}" | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps({'success': d.get('success'), 'errors': d.get('errors'), 'result': d.get('result')}, indent=1))"
          done
          echo "=== what crawlers actually got, last 7 days (request logs, not settings)"
          since=$(date -u -d '-6 days' +%Y-%m-%dT%H:%M:%SZ)
          until=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 - "$zone" "$since" "$until" <<'PY' > /tmp/gql.json
          import json, sys
          zone, since, until = sys.argv[1:4]
          q = """query($zone: String!, $since: Time!, $until: Time!) { viewer { zones(filter: {zoneTag: $zone}) {
            httpRequestsAdaptiveGroups(limit: 200, filter: {datetime_geq: $since, datetime_lt: $until,
              userAgent_like: "%bot%"}, orderBy: [count_DESC]) {
              count dimensions { userAgent edgeResponseStatus clientRequestPath } } } } }"""
          print(json.dumps({"query": q, "variables": {"zone": zone, "since": since, "until": until}}))
          PY
          curl -sS -m 30 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "content-type: application/json" \
            --data @/tmp/gql.json https://api.cloudflare.com/client/v4/graphql | python3 -c "
          import json, re, sys
          d = json.load(sys.stdin)
          print('errors=%s' % d.get('errors'))
          zones = ((d.get('data') or {}).get('viewer') or {}).get('zones') or []
          rows = (zones[0].get('httpRequestsAdaptiveGroups') if zones else None) or []
          agg = {}
          for r in rows:
              ua = r['dimensions']['userAgent']
              m = re.search(r'(GPTBot|OAI-SearchBot|ChatGPT-User|ClaudeBot|Claude-User|Claude-SearchBot|PerplexityBot|Perplexity-User|Googlebot|bingbot|Bytespider|Amazonbot|Applebot|meta-externalagent|CCBot|DuckDuckBot|YandexBot)', ua)
              name = m.group(1) if m else 'other-bot'
              key = (name, r['dimensions']['edgeResponseStatus'])
              agg[key] = agg.get(key, 0) + r['count']
          for (name, status), n in sorted(agg.items(), key=lambda kv: -kv[1]):
              print('%-20s status %s  requests %d' % (name, status, n))
          paths = {}
          for r in rows:
              if re.search(r'GPTBot|ClaudeBot|PerplexityBot|OAI-SearchBot|Googlebot|bingbot', r['dimensions']['userAgent']):
                  p = r['dimensions']['clientRequestPath']
                  paths[p] = paths.get(p, 0) + r['count']
          print('paths fetched by the named crawlers:', sorted(paths.items(), key=lambda kv: -kv[1])[:15])
          "

          echo "=== WAF custom rules that mention bots or user agents"
          api "/zones/${zone}/rulesets/phases/http_request_firewall_custom/entrypoint" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print('success=%s errors=%s' % (d.get('success'), d.get('errors')))
          for r in ((d.get('result') or {}).get('rules') or []):
              expr = r.get('expression', '')
              if any(k in expr.lower() for k in ('bot', 'user_agent', 'verified')):
                  print(r.get('action'), r.get('enabled'), expr[:200])
          "
